
<!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-light fixed-top" id="mainNav">
    <div class="container">
      <a class="navbar-brand fs-1" routerLink=""><i class="fa fa-book" [style.color]="'gold'"></i>Books</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
           Menù
        <span class="navbar-toggler-icon"></span>
       </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarResponsive">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item" *ngFor="let link of linkMenu">
            <a class="nav-link" [routerLink]="this.authService.checkDir() + link.url">{{link.text}}</a>
            <!--<a class="nav-link" routerLink="/book">Home</a>-->
          </li>
         <li *ngIf="!this.authService.checkLogin(); else logout" class="nav-item">
            <a class="nav-link" routerLink="/login">Login <i class="fa fa-lock"></i></a>
          </li>
          <li class="nav-item">
            <a class="nav-link" routerLink="/register">Register</a>
          </li>
          <ng-template #logout>
            <li class="nav-item">
            <a class="nav-link" routerLink="/logout">Logout <i class="fa fa-unlock"></i></a>
          </li>
          </ng-template>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Page Header -->
  <header class="masthead" style="background-image: linear-gradient(rgb(0 0 0 / 9%), rgb(0 0 0 / 42%)),url('assets/img/libri-da-leggere-al-mare-960x640.jpg')">
    <div class="overlay"></div>
    <div class="container">
      <div class="row">
        <div class="col-lg-8 col-md-10 mx-auto">
          <div class="site-heading">
            <h1>I love books <i class="fa fa-heart" [style.color]="'red'"></i></h1>
            <span class="subheading">"La bellezza non è che una promessa di felicità"<br><small><i>(Stendhal, Dell'amore)</i></small></span>
          </div>
        </div>
      </div>
    </div>
  </header>
